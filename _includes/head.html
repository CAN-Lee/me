{% include base_path %}

<meta charset="utf-8">
<!-- Keep old resume and deep links working after moving to the root site. -->
<script>
  if (window.location.hostname === 'can-lee.github.io' && /^\/me(?:\/|$)/.test(window.location.pathname)) {
    window.location.replace('https://can-lee.github.io' +
      (window.location.pathname.replace(/^\/me(?=\/|$)/, '') || '/') +
      window.location.search + window.location.hash);
  }
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=https://can-lee.github.io{{ page.url | escape }}">
</noscript>

<meta name="robots" content="noindex, nofollow, noarchive">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
